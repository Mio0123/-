let timerId = null;
let isSpinning = false;

// 4歳〜39歳を均等な確率で網羅して一括生成
function getRandomAge() {
  const min = 4;
  const max = 39;
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getRandomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function updateRoulette() {
  document.getElementById("situation").textContent = getRandomItem(data.situations);
  document.getElementById("color").textContent = getRandomItem(data.colors);
  document.getElementById("gender").textContent = getRandomItem(data.genders);
  document.getElementById("age").textContent = getRandomAge() + "歳";
}

function toggleRoulette() {
  const btn = document.getElementById("spinBtn");
  
  if (isSpinning) {
    clearInterval(timerId);
    isSpinning = false;
    btn.textContent = "スタート";
    btn.style.backgroundColor = "#3b82f6";
  } else {
    isSpinning = true;
    btn.textContent = "ストップ";
    btn.style.backgroundColor = "#ef4444";
    timerId = setInterval(updateRoulette, 50);
  }
}
